<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00004B">
<title>ページが見つかりません｜QB議事録アシスタント</title>
<!-- 無いページ・無いファイルを開いたときに Cloudflare Pages が返す画面。
     これを置くと、無いファイルに index.html が返らなくなる（404 で返る）。
     スクリプトと外からの読み込みは使わない。色は #00004B 系だけ。 -->
<style>
  html {
    -webkit-text-size-adjust: 100%;
  }
  body {
    margin: 0;
    background: #FFFFFF;
    color: #00004B;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }
  .bar {
    height: 6px;
    background: linear-gradient(90deg, #00004B, #0082CD, #00A5EB);
  }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: calc(48px + env(safe-area-inset-top, 0px)) 24px calc(48px + env(safe-area-inset-bottom, 0px));
    text-align: center;
  }
  h1 {
    margin: 0 0 12px;
    font-size: 22px;
    line-height: 1.4;
  }
  p {
    margin: 0 0 32px;
    font-size: 16px;
  }
  .home {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    min-width: 200px;
    min-height: 48px;
    padding: 0 24px;
    border-radius: 8px;
    background: #00004B;
    color: #FFFFFF;
    font-size: 18px;
    font-weight: 700;
    text-decoration: none;
  }
  .home:active {
    background: #0082CD;
  }
  .home:focus-visible {
    outline: 3px solid #00A5EB;
    outline-offset: 3px;
  }
</style>
</head>
<body>
<div class="bar"></div>
<main>
  <h1>ページが見つかりません</h1>
  <p>アドレスが間違っているか、ページが無くなった可能性があります。</p>
  <a class="home" href="/">トップへ戻る</a>
</main>
</body>
</html>
