<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    議事録アシスタントのアイコン（PNG は scripts/generate-icons.js でここから作る）。
    ・背景は #00004B で全面。四隅の角を丸めない。赤は使わない。文字は入れない（ロゴ規約）。
    ・マイクは中央 60%（102〜410）の内側に収める。Android の丸抜きで欠けないように。
      いまの範囲：横 146〜366、縦 112〜400。
  -->
  <defs>
    <linearGradient id="micBlue" x1="0" y1="218" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00A5EB"/>
      <stop offset="1" stop-color="#0082CD"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#00004B"/>
  <!-- マイクの頭（白） -->
  <path d="M208 160a48 48 0 0 1 96 0v84a48 48 0 0 1-96 0z" fill="#FFFFFF"/>
  <!-- 頭を受けるU字 -->
  <path d="M146 232v12a110 110 0 0 0 220 0v-12a14 14 0 0 0-28 0v12a82 82 0 0 1-164 0v-12a14 14 0 0 0-28 0z" fill="url(#micBlue)"/>
  <!-- 軸と台 -->
  <path d="M242 350h28v26h34a12 12 0 0 1 0 24h-96a12 12 0 0 1 0-24h34z" fill="url(#micBlue)"/>
</svg>
